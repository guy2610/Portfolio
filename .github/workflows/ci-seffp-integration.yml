name: CI - SEFFP Integration (E2E)

on:
  push:
    branches: [ "main", "stage3-ci" ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "Secure-Encrypted-File-Transfer-Protocol/vcpkg.json"
          vcpkgDirectory: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg"

      - name: Configure client
        run: >
          cmake -S Secure-Encrypted-File-Transfer-Protocol -B build/seffp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build client
        run: cmake --build build/seffp --config Release

      - name: Start server (background)
        env:
          PYTHONPATH: ${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server
        run: |
          set -e
          cd Secure-Encrypted-File-Transfer-Protocol/server
          echo "1234" > port.info
          nohup python -u server_async.py > ../../server_e2e.log 2>&1 &
          echo $! > ../../server_e2e.pid
          sleep 1

      - name: Wait for server port
        run: |
          python - <<'PY'
          import socket, time, sys
          host, port = "127.0.0.1", 1234
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print("server is up")
                      sys.exit(0)
              except OSError:
                  time.sleep(0.5)
          print("server did not open port in time")
          sys.exit(1)
          PY

      - name: Run first client (register + upload)
        run: |
          set -e
          WORKDIR="$(pwd)/e2e_workdir"
          mkdir -p "$WORKDIR"
          echo "127.0.0.1:1234" > "$WORKDIR/transfer.info"
          echo "ci_user" >> "$WORKDIR/transfer.info"
          echo "hello from ci" > "$WORKDIR/test.txt"

          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"
          cp "$CLIENT_BIN" "$WORKDIR/"

          cd "$WORKDIR"
          ./seffp_client --info --files=test.txt

      - name: Run second client (relogin)
        run: |
          set -e
          cd e2e_workdir
          ./seffp_client --info --files=test.txt > second_run.log

          echo "==== Second run output ===="
          cat second_run.log

          if grep -q "825" second_run.log; then
            echo "Unexpected registration on relogin"
            exit 1
          fi

          if ! grep -q "827" second_run.log; then
            echo "Relogin (827) not detected"
            exit 1
          fi

      - name: Multi-file upload
        run: |
          set -e
          echo "another file" > e2e_workdir/test2.txt
          cd e2e_workdir
          ./seffp_client --info --files=test.txt,test2.txt

      - name: Parallel clients upload (5 clients)
        run: |
          set -euo pipefail
          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"

          BASE="$(pwd)/e2e_parallel"
          rm -rf "$BASE"
          mkdir -p "$BASE"

          N=5
          for i in $(seq 1 $N); do
            W="$BASE/u$i"
            mkdir -p "$W"
            echo "127.0.0.1:1234" > "$W/transfer.info"
            echo "ci_user_$i" >> "$W/transfer.info"
            echo "hello from client $i" > "$W/file_$i.txt"
            cp "$CLIENT_BIN" "$W/"
          done

          pids=""
          for i in $(seq 1 $N); do
            (
              cd "$BASE/u$i"
              ./seffp_client --info --files="file_$i.txt" > "run.log" 2>&1
            ) &
            pids="$pids $!"
          done

          fail=0
          for p in $pids; do
            if ! wait "$p"; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "At least one client failed. Dump logs:"
            for i in $(seq 1 $N); do
              echo "==== client $i log ===="
              cat "$BASE/u$i/run.log" || true
            done
            exit 1
          fi

      - name: Restart server with small limits (for A)
        env:
          SEFTP_MAX_FILE_SIZE: "64"
          PYTHONPATH: ${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server
        run: |
          set +e
          PID=$(cat server_e2e.pid 2>/dev/null)
          if [ -n "$PID" ]; then
            kill -INT "$PID" 2>/dev/null
            for i in $(seq 1 50); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 0.2
            done
            kill -KILL "$PID" 2>/dev/null || true
          fi
          pkill -f "python .*server_async\.py" 2>/dev/null || true
          sleep 0.2

          rm -f server_e2e.pid || true
          : > "${{ github.workspace }}/server_e2e.log"

      - name: Start server (background) with SEFTP_MAX_FILE_SIZE=64
        env:
          SEFTP_MAX_FILE_SIZE: "64"
          PYTHONPATH: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server"
        run: |
          set -e
          cd Secure-Encrypted-File-Transfer-Protocol/server
          echo "1234" > port.info
          nohup python -u server_async.py > ../../server_e2e.log 2>&1 &
          echo $! > ../../server_e2e.pid
          sleep 1

      - name: "Limit (client): oversize file rejected"
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)/e2e_workdir_limits"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          echo "127.0.0.1:1234" > "$WORKDIR/transfer.info"
          echo "ci_limits_user" >> "$WORKDIR/transfer.info"

          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"
          cp "$CLIENT_BIN" "$WORKDIR/"
          cd "$WORKDIR"

          # create file > 64 bytes (max)
          python -c "from pathlib import Path; Path('big.bin').write_bytes(b'A'*200)"

          # expect failure
          set +e
          ./seffp_client --info --files=big.bin > run.log 2>&1
          code=$?
          set -e

          echo "exit_code=$code"
          cat run.log || true

          #client-side assertion: got server rejection (1607)
          if ! grep -Eq "answer_1607|general error \{bad 828:" run.log; then
          echo "Expected client to observe 1607 / bad 828 error"
          exit 1
          fi

          echo "==== server log tail ===="
          tail -n 250 ../server_e2e.log || true

          if ! grep -q "bad_828_limits" ../server_e2e.log; then
            echo "Expected bad_828_limits reset reason"
            exit 1
          fi

          if ! grep -Eq "orig_file_size too large|content_size too large" ../server_e2e.log; then
            echo "Expected size-too-large log"
            exit 1
          fi

      - name: Assert parallel uploads exist on disk
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            P="Secure-Encrypted-File-Transfer-Protocol/server/data/uploads/ci_user_$i/file_$i.txt"
            if [ ! -f "$P" ]; then
              echo "Missing: $P"
              echo "==== server log tail ===="
              tail -n 250 server_e2e.log || true
              echo "==== uploads tree ===="
              find Secure-Encrypted-File-Transfer-Protocol/server/data/uploads -maxdepth 3 -type f -print || true
              exit 1
            fi
          done
          echo "parallel uploads exist"

      - name: Stop server (graceful + fallback)
        if: always()
        run: |
          set +e
          PID=$(cat server_e2e.pid 2>/dev/null)

          echo "Stopping server PID=$PID"

          if [ -n "$PID" ]; then
            ps -p "$PID" -o pid,ppid,pgid,sid,cmd || true

            kill -INT "$PID" 2>/dev/null

            for i in $(seq 1 80); do
              kill -0 "$PID" 2>/dev/null || { echo "server stopped cleanly"; break; }
              sleep 0.2
            done

            if kill -0 "$PID" 2>/dev/null; then
              echo "Escalating kill"
              kill -TERM "$PID" 2>/dev/null
              sleep 0.5
              kill -KILL "$PID" 2>/dev/null
            fi
          fi

          # Ensure nothing remains
          pkill -f "python .*server_async\.py" 2>/dev/null || true
          sleep 0.2

          if pgrep -f "python .*server_async\.py" >/dev/null; then
            echo "Server still running"
            pgrep -af "python .*server_async\.py"
            exit 1
          fi

          echo "Server fully stopped"
          tail -n 200 server_e2e.log || true

      - name: Assert clients_info persisted
        run: |
          set -e
          FILE="Secure-Encrypted-File-Transfer-Protocol/server/data/clients_info.json"

          if [ ! -f "$FILE" ]; then
            echo "clients_info.json not found"
            exit 1
          fi

          python - <<PY
          import json, pathlib
          p = pathlib.Path("$FILE")
          data = json.loads(p.read_text())
          assert isinstance(data, dict)
          print("clients_info entries:", len(data))
          PY

  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "Secure-Encrypted-File-Transfer-Protocol/vcpkg.json"
          vcpkgDirectory: "${{ github.workspace }}\\Secure-Encrypted-File-Transfer-Protocol\\vcpkg"

      - name: Configure client
        run: >
          cmake -S Secure-Encrypted-File-Transfer-Protocol -B build\seffp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}\Secure-Encrypted-File-Transfer-Protocol\vcpkg\scripts\buildsystems\vcpkg.cmake

      - name: Build client
        run: cmake --build build\seffp --config Release

      - name: Resolve client exe path
        shell: pwsh
        run: |
          $candidates = @(
            "build\seffp\seffp_client.exe",
            "build\seffp\Release\seffp_client.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "seffp_client.exe not found in expected locations" }
          "CLIENT_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "CLIENT_EXE=$exe"

      - name: Start server (background)
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\Secure-Encrypted-File-Transfer-Protocol\server
        run: |
          Set-Location Secure-Encrypted-File-Transfer-Protocol\server
          "1234" | Out-File -Encoding ascii -NoNewline port.info

          $out = Join-Path $pwd "..\..\server_win.out.log"
          $err = Join-Path $pwd "..\..\server_win.err.log"

          $p = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -NoNewWindow -PassThru `
                -RedirectStandardOutput $out -RedirectStandardError $err
          $p.Id | Out-File -Encoding ascii -NoNewline "..\..\server_win.pid"
          Start-Sleep -Seconds 2

          Write-Host "Server PID=$($p.Id)"

      - name: Wait for server port
        shell: pwsh
        run: |
          python -c "import socket,time,sys; host='127.0.0.1'; port=1234; deadline=time.time()+20; 
          while time.time()<deadline:
            try:
              s=socket.create_connection((host,port),timeout=1); s.close(); print('server is up'); sys.exit(0)
            except OSError:
              time.sleep(0.5)
          print("server did not open port in time");sys.exit(1)"

      - name: Run first client (register + upload)
        shell: pwsh
        run: |
          $work = Join-Path $pwd "e2e_workdir"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null

          "127.0.0.1:1234`nci_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work "transfer.info")
          "hello from ci" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test.txt")

          Copy-Item $env:CLIENT_EXE (Join-Path $work "seffp_client.exe")

          Push-Location $work
          .\seffp_client.exe --info --files=test.txt
          Pop-Location

      - name: Run second client (relogin)
        shell: pwsh
        run: |
          $work = Join-Path $pwd "e2e_workdir"
          Push-Location $work
          .\seffp_client.exe --info --files=test.txt *> second_run.log
          Get-Content second_run.log

          $txt = Get-Content second_run.log -Raw
          if ($txt -match "825") { throw "Unexpected registration on relogin (825)" }
          if ($txt -notmatch "827") { throw "Relogin (827) not detected" }
          Pop-Location

      - name: Multi-file upload
        shell: pwsh
        run: |
          $work = Join-Path $pwd "e2e_workdir"
          "another file" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test2.txt")
          Push-Location $work
          .\seffp_client.exe --info --files=test.txt,test2.txt
          Pop-Location

      - name: Parallel clients upload (5 clients)
        shell: pwsh
        run: |
          $base = Join-Path $pwd "e2e_parallel"
          Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $base | Out-Null

          $N = 5
          $procs = @()

          for ($i=1; $i -le $N; $i++) {
            $w = Join-Path $base "u$i"
            New-Item -ItemType Directory -Path $w | Out-Null
            "127.0.0.1:1234`nci_user_$i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "transfer.info")
            "hello from client $i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "file_$i.txt")
            Copy-Item $env:CLIENT_EXE (Join-Path $w "seffp_client.exe")

            $p = Start-Process -FilePath (Join-Path $w "seffp_client.exe") `
                  -ArgumentList @("--info","--files=file_$i.txt") `
                  -WorkingDirectory $w -NoNewWindow -PassThru `
                  -RedirectStandardOutput (Join-Path $w "run.log") `
                  -RedirectStandardError (Join-Path $w "run.log")
            $procs += $p
          }

          $failed = $false
          foreach ($p in $procs) {
            $p.WaitForExit()
            if ($p.ExitCode -ne 0) { $failed = $true }
          }

          if ($failed) {
            for ($i=1; $i -le $N; $i++) {
              Write-Host "==== client $i log ===="
              Get-Content (Join-Path $base "u$i\run.log") -ErrorAction SilentlyContinue
            }
            throw "At least one parallel client failed"
          }

      - name: Stop server (before limits restart)
        shell: pwsh
        run: |
          $pidFile = Join-Path $pwd "server_win.pid"
          if (Test-Path $pidFile) {
            $pid = Get-Content $pidFile
            try { Stop-Process -Id $pid -Force -ErrorAction SilentlyContinue } catch {}
          }
          Start-Sleep -Seconds 1
          Get-Content (Join-Path $pwd "server_win.log") -ErrorAction SilentlyContinue | Select-Object -Last 200

      - name: Start server (background) with SEFTP_MAX_FILE_SIZE=64
        shell: pwsh
        env:
          SEFTP_MAX_FILE_SIZE: "64"
          PYTHONPATH: ${{ github.workspace }}\Secure-Encrypted-File-Transfer-Protocol\server
        run: |
          Set-Location Secure-Encrypted-File-Transfer-Protocol\server
          "1234" | Out-File -Encoding ascii -NoNewline port.info

          $out = Join-Path $pwd "..\..\server_win_limits.out.log"
          $err = Join-Path $pwd "..\..\server_win_limits.err.log"

          $p = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -NoNewWindow -PassThru `
                -RedirectStandardOutput $out -RedirectStandardError $err
          $p.Id | Out-File -Encoding ascii -NoNewline "..\..\server_win_limits.pid"
          Start-Sleep -Seconds 2

          Write-Host "Server(limits) PID=$($p.Id)"

      - name: Wait for server port (limits)
        shell: pwsh
        run: |
          python - <<'PY'
          import socket, time, sys
          host, port = "127.0.0.1", 1234
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print("server is up (limits)")
                      sys.exit(0)
              except OSError:
                  time.sleep(0.5)
          print("server did not open port in time (limits)")
          sys.exit(1)
          PY

      - name: "Limit (client): oversize file rejected"
        shell: pwsh
        run: |
          $work = Join-Path $pwd "e2e_workdir_limits"
          Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $work | Out-Null

          "127.0.0.1:1234`nci_limits_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work "transfer.info")
          Copy-Item $env:CLIENT_EXE (Join-Path $work "seffp_client.exe")

          python -c "from pathlib import Path; Path(r'$work\big.bin').write_bytes(b'A'*200)"

          Push-Location $work
          cmd /c ".\seffp_client.exe --info --files=big.bin > run.log 2>&1"
          Pop-Location

          $log = Get-Content (Join-Path $work "run.log") -Raw
          Write-Host $log

          if ($log -notmatch "answer_1607|general error \{bad 828:") {
            throw "Expected client to observe 1607 / bad 828 error"
          }

          $slog = Get-Content (Join-Path $pwd "server_win_limits.log") -Raw
          if ($slog -notmatch "1607") { throw "Expected 1607 in server log" }
          if ($slog -notmatch "bad_828_limits") { throw "Expected bad_828_limits reset reason" }

      - name: Stop server (final)
        if: always()
        shell: pwsh
        run: |
          foreach ($f in @("server_win_limits.pid","server_win.pid")) {
            $pidPath = Join-Path $pwd $f
            if (Test-Path $pidPath) {
              $serverPid = Get-Content $pidPath
              try {
                Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue
              } catch {}
            }
          }

          Write-Host "==== server stdout tail ===="
          Get-Content (Join-Path $pwd "server_win.out.log") -ErrorAction SilentlyContinue | Select-Object -Last 200
          Write-Host "==== server stderr tail ===="
          Get-Content (Join-Path $pwd "server_win.err.log") -ErrorAction SilentlyContinue | Select-Object -Last 200