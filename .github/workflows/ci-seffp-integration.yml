name: CI - SEFFP Integration (E2E)

on:
  push:
    branches: [ "main", "stage3-ci" ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "Secure-Encrypted-File-Transfer-Protocol/vcpkg.json"
          vcpkgDirectory: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg"

      - name: Configure client
        run: >
          cmake -S Secure-Encrypted-File-Transfer-Protocol -B build/seffp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build client
        run: cmake --build build/seffp --config Release

      - name: Start server (background)
        env:
          PYTHONPATH: ${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server
        run: |
          set -e
          cd Secure-Encrypted-File-Transfer-Protocol/server
          echo "1234" > port.info
          nohup python -u server_async.py > ../../server_e2e.log 2>&1 &
          echo $! > ../../server_e2e.pid
          sleep 1

      - name: Wait for server port
        run: |
          python - <<'PY'
          import socket, time, sys
          host, port = "127.0.0.1", 1234
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print("server is up")
                      sys.exit(0)
              except OSError:
                  time.sleep(0.5)
          print("server did not open port in time")
          sys.exit(1)
          PY

      - name: Run first client (register + upload)
        run: |
          set -e
          WORKDIR="$(pwd)/e2e_workdir"
          mkdir -p "$WORKDIR"
          echo "127.0.0.1:1234" > "$WORKDIR/transfer.info"
          echo "ci_user" >> "$WORKDIR/transfer.info"
          echo "hello from ci" > "$WORKDIR/test.txt"

          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"
          cp "$CLIENT_BIN" "$WORKDIR/"

          cd "$WORKDIR"
          ./seffp_client --info --files=test.txt

      - name: Run second client (relogin)
        run: |
          set -e
          cd e2e_workdir
          ./seffp_client --info --files=test.txt > second_run.log

          echo "==== Second run output ===="
          cat second_run.log

          if grep -q "request_825" second_run.log; then
            echo "Unexpected registration on relogin"
            exit 1
          fi

          if ! grep -q "request_827" second_run.log; then
            echo "Relogin (827) not detected"
            exit 1
          fi

      - name: Multi-file upload
        run: |
          set -e
          echo "another file" > e2e_workdir/test2.txt
          cd e2e_workdir
          ./seffp_client --info --files=test.txt,test2.txt

      - name: Parallel clients upload (5 clients)
        run: |
          set -euo pipefail
          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"

          BASE="$(pwd)/e2e_parallel"
          rm -rf "$BASE"
          mkdir -p "$BASE"

          N=5
          for i in $(seq 1 $N); do
            W="$BASE/u$i"
            mkdir -p "$W"
            echo "127.0.0.1:1234" > "$W/transfer.info"
            echo "ci_user_$i" >> "$W/transfer.info"
            echo "hello from client $i" > "$W/file_$i.txt"
            cp "$CLIENT_BIN" "$W/"
          done

          pids=""
          for i in $(seq 1 $N); do
            (
              cd "$BASE/u$i"
              ./seffp_client --info --files="file_$i.txt" > "run.log" 2>&1
            ) &
            pids="$pids $!"
          done

          fail=0
          for p in $pids; do
            if ! wait "$p"; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "At least one client failed. Dump logs:"
            for i in $(seq 1 $N); do
              echo "==== client $i log ===="
              cat "$BASE/u$i/run.log" || true
            done
            exit 1
          fi

      - name: Restart server with small limits (for A)
        env:
          SEFTP_MAX_FILE_SIZE: "64"
          PYTHONPATH: ${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server
        run: |
          set +e
          PID=$(cat server_e2e.pid 2>/dev/null)
          if [ -n "$PID" ]; then
            kill -INT "$PID" 2>/dev/null
            for i in $(seq 1 50); do
              kill -0 "$PID" 2>/dev/null || break
              sleep 0.2
            done
            kill -KILL "$PID" 2>/dev/null || true
          fi
          pkill -f "python .*server_async\.py" 2>/dev/null || true
          sleep 0.2

          rm -f server_e2e.pid || true
          : > "${{ github.workspace }}/server_e2e.log"

      - name: Start server (background) with SEFTP_MAX_FILE_SIZE=64
        env:
          SEFTP_MAX_FILE_SIZE: "64"
          PYTHONPATH: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server"
        run: |
          set -e
          cd Secure-Encrypted-File-Transfer-Protocol/server
          echo "1234" > port.info
          nohup python -u server_async.py > ../../server_e2e.log 2>&1 &
          echo $! > ../../server_e2e.pid
          sleep 1

      - name: "Limit (client): oversize file rejected"
        run: |
          set -euo pipefail
          WORKDIR="$(pwd)/e2e_workdir_limits"
          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"

          echo "127.0.0.1:1234" > "$WORKDIR/transfer.info"
          echo "ci_limits_user" >> "$WORKDIR/transfer.info"

          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"
          cp "$CLIENT_BIN" "$WORKDIR/"
          cd "$WORKDIR"

          # create file > 64 bytes (max)
          python -c "from pathlib import Path; Path('big.bin').write_bytes(b'A'*200)"

          # expect failure
          set +e
          ./seffp_client --info --files=big.bin > run.log 2>&1
          code=$?
          set -e

          echo "exit_code=$code"
          cat run.log || true

          #client-side assertion: got server rejection (1607)
          if ! grep -Eq "answer_1607|general error \{bad 828:" run.log; then
          echo "Expected client to observe 1607 / bad 828 error"
          exit 1
          fi

          echo "==== server log tail ===="
          tail -n 250 ../server_e2e.log || true

          if ! grep -q "bad_828_limits" ../server_e2e.log; then
            echo "Expected bad_828_limits reset reason"
            exit 1
          fi

          if ! grep -Eq "orig_file_size too large|content_size too large" ../server_e2e.log; then
            echo "Expected size-too-large log"
            exit 1
          fi

      - name: Assert parallel uploads exist on disk
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            P="Secure-Encrypted-File-Transfer-Protocol/server/data/uploads/ci_user_$i/file_$i.txt"
            if [ ! -f "$P" ]; then
              echo "Missing: $P"
              echo "==== server log tail ===="
              tail -n 250 server_e2e.log || true
              echo "==== uploads tree ===="
              find Secure-Encrypted-File-Transfer-Protocol/server/data/uploads -maxdepth 3 -type f -print || true
              exit 1
            fi
          done
          echo "parallel uploads exist"

      - name: Stop server (graceful + fallback)
        if: always()
        run: |
          set +e
          PID=$(cat server_e2e.pid 2>/dev/null)

          echo "Stopping server PID=$PID"

          if [ -n "$PID" ]; then
            ps -p "$PID" -o pid,ppid,pgid,sid,cmd || true

            kill -INT "$PID" 2>/dev/null

            for i in $(seq 1 80); do
              kill -0 "$PID" 2>/dev/null || { echo "server stopped cleanly"; break; }
              sleep 0.2
            done

            if kill -0 "$PID" 2>/dev/null; then
              echo "Escalating kill"
              kill -TERM "$PID" 2>/dev/null
              sleep 0.5
              kill -KILL "$PID" 2>/dev/null
            fi
          fi

          # Ensure nothing remains
          pkill -f "python .*server_async\.py" 2>/dev/null || true
          sleep 0.2

          if pgrep -f "python .*server_async\.py" >/dev/null; then
            echo "Server still running"
            pgrep -af "python .*server_async\.py"
            exit 1
          fi

          echo "Server fully stopped"
          tail -n 200 server_e2e.log || true

      - name: Assert clients_info persisted
        run: |
          set -e
          FILE="Secure-Encrypted-File-Transfer-Protocol/server/data/clients_info.json"

          if [ ! -f "$FILE" ]; then
            echo "clients_info.json not found"
            exit 1
          fi

          python - <<PY
          import json, pathlib
          p = pathlib.Path("$FILE")
          data = json.loads(p.read_text())
          assert isinstance(data, dict)
          print("clients_info entries:", len(data))
          PY

  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: E2E (Windows) - server + clients in one step
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\Secure-Encrypted-File-Transfer-Protocol\server
        run: |
          $ErrorActionPreference = "Stop"

          function Wait-Port([string]$host, [int]$port, [int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try {
                $c = New-Object System.Net.Sockets.TcpClient
                $c.Connect($host, $port)
                $c.Close()
                return
              } catch {
                Start-Sleep -Milliseconds 300
              }
            }
            throw "server did not open port in time"
          }

          # Resolve client exe (already built)
          $root = $env:GITHUB_WORKSPACE

          $candidates = @(
            (Join-Path $root "build\seffp\Release\seffp_client.exe"),
            (Join-Path $root "build\seffp\seffp_client.exe")
          )

          $clientExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $clientExe) {
            $found = Get-ChildItem -Path (Join-Path $root "build\seffp") -Recurse -Filter "seffp_client.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $clientExe = $found.FullName }
          }

          if (-not $clientExe) {
            Write-Host "Listing build\seffp:"
            Get-ChildItem -Path (Join-Path $root "build\seffp") -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host
            throw "seffp_client.exe not found"
          }

          Write-Host "CLIENT_EXE=$clientExe"

          # ---------- Start normal server ----------
          $ServerDir = Join-Path $env:GITHUB_WORKSPACE "Secure-Encrypted-File-Transfer-Protocol\server"
          Set-Location $ServerDir
          "1234" | Set-Content -NoNewline -Path ".\port.info"

          $OutLog = Join-Path $env:GITHUB_WORKSPACE "server_win.out.log"
          $ErrLog = Join-Path $env:GITHUB_WORKSPACE "server_win.err.log"
          Remove-Item $OutLog,$ErrLog -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -WorkingDirectory $ServerDir `
                -RedirectStandardOutput $OutLog -RedirectStandardError $ErrLog -PassThru

          try {
            Wait-Port "127.0.0.1" 1234 30

            # ---------- E2E workdir ----------
            $root = $env:GITHUB_WORKSPACE
            $work = Join-Path $root "e2e_workdir"
            Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $work | Out-Null

            "127.0.0.1:1234`nci_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work "transfer.info")
            "hello from ci" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test.txt")
            Copy-Item $clientExe (Join-Path $work "seffp_client.exe")

            Push-Location $work
            .\seffp_client.exe --info --files=test.txt
            .\seffp_client.exe --info --files=test.txt *> second_run.log
            $txt = Get-Content second_run.log -Raw
            if ($txt -match "request_825") { throw "Unexpected registration on relogin" }
            if ($txt -notmatch "request_827") { throw "Relogin not detected" }

            "another file" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test2.txt")
            .\seffp_client.exe --info --files=test.txt,test2.txt
            Pop-Location

            # ---------- Parallel ----------
            $base = Join-Path $root "e2e_parallel"
            Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $base | Out-Null

            $N = 5
            $procs = @()
            for ($i=1; $i -le $N; $i++) {
              $w = Join-Path $base "u$i"
              New-Item -ItemType Directory -Path $w | Out-Null
              "127.0.0.1:1234`nci_user_$i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "transfer.info")
              "hello from client $i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "file_$i.txt")
              Copy-Item $clientExe (Join-Path $w "seffp_client.exe")

              $pp = Start-Process -FilePath (Join-Path $w "seffp_client.exe") `
                    -ArgumentList @("--info","--files=file_$i.txt") `
                    -WorkingDirectory $w -NoNewWindow -PassThru `
                    -RedirectStandardOutput (Join-Path $w "run.out.log") `
                    -RedirectStandardError  (Join-Path $w "run.err.log")
              $procs += $pp
            }

            $failed = $false
            foreach ($pp in $procs) {
              $pp.WaitForExit()
              if ($pp.ExitCode -ne 0) { $failed = $true }
            }
            if ($failed) {
              for ($i=1; $i -le $N; $i++) {
                Write-Host "==== client $i log ===="
                Get-Content (Join-Path $base "u$i\run.out.log") -ErrorAction SilentlyContinue
                Get-Content (Join-Path $base "u$i\run.err.log") -ErrorAction SilentlyContinue
              }
              throw "At least one parallel client failed"
            }

          } finally {
            try { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Milliseconds 300
            Write-Host "==== server stdout tail ===="
            if (Test-Path $OutLog) { Get-Content $OutLog -Tail 200 }
            Write-Host "==== server stderr tail ===="
            if (Test-Path $ErrLog) { Get-Content $ErrLog -Tail 200 }
          }

          # ---------- Limits server (same step) ----------
          $env:SEFTP_MAX_FILE_SIZE = "64"
          Set-Location $ServerDir

          $OutLog2 = Join-Path $env:GITHUB_WORKSPACE "server_win_limits.out.log"
          $ErrLog2 = Join-Path $env:GITHUB_WORKSPACE "server_win_limits.err.log"
          Remove-Item $OutLog2,$ErrLog2 -Force -ErrorAction SilentlyContinue

          $p2 = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -WorkingDirectory $ServerDir `
                -RedirectStandardOutput $OutLog2 -RedirectStandardError $ErrLog2 -PassThru

          try {
            Wait-Port "127.0.0.1" 1234 30

            $work2 = Join-Path $env:GITHUB_WORKSPACE "e2e_workdir_limits"
            Remove-Item -Recurse -Force $work2 -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $work2 | Out-Null

            "127.0.0.1:1234`nci_limits_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work2 "transfer.info")
            Copy-Item $clientExe (Join-Path $work2 "seffp_client.exe")
            python -c "from pathlib import Path; Path(r'$work2\big.bin').write_bytes(b'A'*200)"

            Push-Location $work2
            cmd /c ".\seffp_client.exe --info --files=big.bin > run.log 2>&1"
            Pop-Location

            $clientLog = Get-Content (Join-Path $work2 "run.log") -Raw
            if ($clientLog -notmatch "answer_1607|general error \{bad 828:") {
              throw "Expected client to observe 1607 / bad 828 error"
            }

            $slog = ""
            if (Test-Path $OutLog2) { $slog += (Get-Content $OutLog2 -Raw) }
            if (Test-Path $ErrLog2) { $slog += (Get-Content $ErrLog2 -Raw) }
            if ($slog -notmatch "1607") { throw "Expected 1607 in server log" }
            if ($slog -notmatch "bad_828_limits") { throw "Expected bad_828_limits reset reason" }

          } finally {
            try { Stop-Process -Id $p2.Id -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Milliseconds 300
            Write-Host "==== limits server stdout tail ===="
            if (Test-Path $OutLog2) { Get-Content $OutLog2 -Tail 200 }
            Write-Host "==== limits server stderr tail ===="
            if (Test-Path $ErrLog2) { Get-Content $ErrLog2 -Tail 200 }
          }