name: CI - SEFFP Integration (E2E)

on:
  push:
    branches: [ "main", "stage3-ci" ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install server deps
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "Secure-Encrypted-File-Transfer-Protocol/vcpkg.json"
          vcpkgDirectory: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg"

      - name: Configure client
        run: >
          cmake -S Secure-Encrypted-File-Transfer-Protocol -B build/seffp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build client
        run: cmake --build build/seffp --config Release

      - name: Start server (background)
        run: |
          set -e
          cd Secure-Encrypted-File-Transfer-Protocol/server
          echo "1234" > port.info
          export PYTHONPATH="${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/server"

          nohup python -u server_async.py > ../../server_e2e.log 2>&1 &
          echo $! > ../../server_e2e.pid
          sleep 1

          echo "Server PID=$(cat ../../server_e2e.pid)"
          ps -p "$(cat ../../server_e2e.pid)" -o pid,ppid,pgid,sid,cmd

      - name: Wait for server port
        run: |
          python - <<'PY'
          import socket, time, sys
          host, port = "127.0.0.1", 1234
          deadline = time.time() + 20
          while time.time() < deadline:
              try:
                  with socket.create_connection((host, port), timeout=1):
                      print("server is up")
                      sys.exit(0)
              except OSError:
                  time.sleep(0.5)
          print("server did not open port in time")
          sys.exit(1)
          PY

      - name: Run first client (register + upload)
        run: |
          set -e
          WORKDIR="$(pwd)/e2e_workdir"
          mkdir -p "$WORKDIR"
          echo "127.0.0.1:1234" > "$WORKDIR/transfer.info"
          echo "ci_user" >> "$WORKDIR/transfer.info"
          echo "hello from ci" > "$WORKDIR/test.txt"

          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"
          cp "$CLIENT_BIN" "$WORKDIR/"

          cd "$WORKDIR"
          ./seffp_client --info --files=test.txt

      - name: Run second client (relogin)
        run: |
          set -e
          cd e2e_workdir
          ./seffp_client --info --files=test.txt > second_run.log

          echo "==== Second run output ===="
          cat second_run.log

          if grep -q "825" second_run.log; then
            echo "Unexpected registration on relogin"
            exit 1
          fi

          if ! grep -q "827" second_run.log; then
            echo "Relogin (827) not detected"
            exit 1
          fi

      - name: Multi-file upload
        run: |
          set -e
          echo "another file" > e2e_workdir/test2.txt
          cd e2e_workdir
          ./seffp_client --info --files=test.txt,test2.txt

      - name: Parallel clients upload (5 clients)
        run: |
          set -euo pipefail
          CLIENT_BIN="$(pwd)/build/seffp/seffp_client"

          BASE="$(pwd)/e2e_parallel"
          rm -rf "$BASE"
          mkdir -p "$BASE"

          N=5
          for i in $(seq 1 $N); do
            W="$BASE/u$i"
            mkdir -p "$W"
            echo "127.0.0.1:1234" > "$W/transfer.info"
            echo "ci_user_$i" >> "$W/transfer.info"
            echo "hello from client $i" > "$W/file_$i.txt"
            cp "$CLIENT_BIN" "$W/"
          done

          pids=""
          for i in $(seq 1 $N); do
            (
              cd "$BASE/u$i"
              ./seffp_client --info --files="file_$i.txt" > "run.log" 2>&1
            ) &
            pids="$pids $!"
          done

          fail=0
          for p in $pids; do
            if ! wait "$p"; then
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "At least one client failed. Dump logs:"
            for i in $(seq 1 $N); do
              echo "==== client $i log ===="
              cat "$BASE/u$i/run.log" || true
            done
            exit 1
          fi
      
      - name: Limit tests (raw socket): max_file_size + upload_timeout
        run: |
          set -euo pipefail

          # Resolve server root so we can import protocol framing helpers if needed (we won't)
          HOST="127.0.0.1"
          PORT="1234"

          python - <<'PY'
          import socket, struct, time, sys

          HOST = "127.0.0.1"
          PORT = 1234

          def le16(n: int) -> bytes: return struct.pack("<H", n)
          def le32(n: int) -> bytes: return struct.pack("<I", n)

          # Frame format in your project:
          # client_id(16) + version(1) + code(2 LE) + payload_size(4 LE) + payload
          def build_frame(client_id: bytes, version: bytes, code: int, payload: bytes) -> bytes:
              assert len(client_id) == 16
              assert len(version) == 1
              return client_id + version + le16(code) + le32(len(payload)) + payload

          def recv_some(sock: socket.socket, timeout_s: float = 2.0) -> bytes:
              sock.settimeout(timeout_s)
              try:
                  return sock.recv(8192)
              except socket.timeout:
                  return b""

          def expect_1607(resp: bytes, ctx: str):
              # 1607 LE == 0x0647 bytes in stream (as part of response code field)
              if b"\x47\x06" not in resp:
                  print(f"[FAIL] expected 1607 in response for {ctx}. resp_len={len(resp)}")
                  print(resp[:200])
                  sys.exit(1)

          # -------------------------
          # A) max_file_size: send 828 packet0 with content_size > max_file_size
          # -------------------------
          # Use something safely above your default max_file_size=100MB
          too_big_content_size = 150 * 1024 * 1024  # 150MB
          client_id = b"\x01" * 16
          version = b"\x03"

          # 828 payload structure in your handler:
          # u32 content_size + u32 orig_file_size + u16 packet_num + u16 total_packets + filename\0 + (iv or chunk)
          filename = b"too_big.bin"
          iv = b"\xAA" * 16
          payload0 = (
              le32(too_big_content_size) +
              le32(1) +
              le16(0) +
              le16(1) +
              filename + b"\x00" +
              iv
          )
          frame0 = build_frame(client_id, version, 828, payload0)

          s = socket.create_connection((HOST, PORT), timeout=3)
          s.sendall(frame0)
          resp = recv_some(s, timeout_s=3.0)
          expect_1607(resp, "max_file_size (828 packet0 too big)")

          # server may close after 1607. ensure connection is not usable
          try:
              s.sendall(b"x")
          except OSError:
              pass
          s.close()
          print("[OK] max_file_size enforced (1607 returned)")

          # -------------------------
          # C) upload inactivity timeout:
          # start upload (828 packet0 with small sizes) then stop sending
          # expect server to eventually 1607 + disconnect (or just disconnect) after upload_inactivity_timeout_s
          # -------------------------
          small_content_size = 32
          orig_size = 16
          total_packets = 2
          filename2 = b"idle_upload.bin"
          payload0b = (
              le32(small_content_size) +
              le32(orig_size) +
              le16(0) +
              le16(total_packets) +
              filename2 + b"\x00" +
              iv
          )
          frame0b = build_frame(client_id, version, 828, payload0b)

          s2 = socket.create_connection((HOST, PORT), timeout=3)
          s2.sendall(frame0b)

          # Now go idle. Your server checks inactivity only on asyncio.TimeoutError (every 10s read timeout),
          # and compares against upload_inactivity_timeout_s (default 20s).
          # Give it enough time: 35s total with small polling reads.
          deadline = time.time() + 40
          got_1607 = False
          while time.time() < deadline:
              chunk = recv_some(s2, timeout_s=1.0)
              if chunk:
                  if b"\x47\x06" in chunk:
                      got_1607 = True
                      break
              time.sleep(0.5)

          # Either it sends 1607 or just closes. Prefer explicit 1607, but allow close.
          if not got_1607:
              # check if socket already closed
              try:
                  s2.settimeout(1.0)
                  more = s2.recv(16)
                  if more == b"":
                      print("[OK] upload inactivity: server closed connection (no explicit 1607 observed)")
                  else:
                      print("[FAIL] upload inactivity: still receiving data but no 1607, unexpected")
                      sys.exit(1)
              except (socket.timeout, ConnectionResetError, BrokenPipeError, OSError):
                  print("[OK] upload inactivity: connection terminated")
          else:
              print("[OK] upload inactivity enforced (1607 observed)")

          try:
              s2.close()
          except Exception:
              pass
          PY

      - name: Assert parallel uploads exist on disk
        run: |
          set -euo pipefail
          for i in $(seq 1 5); do
            P="Secure-Encrypted-File-Transfer-Protocol/server/data/uploads/ci_user_$i/file_$i.txt"
            if [ ! -f "$P" ]; then
              echo "Missing: $P"
              echo "==== server log tail ===="
              tail -n 250 server_e2e.log || true
              echo "==== uploads tree ===="
              find Secure-Encrypted-File-Transfer-Protocol/server/data/uploads -maxdepth 3 -type f -print || true
              exit 1
            fi
          done
          echo "parallel uploads exist"

      - name: Stop server (graceful + fallback)
        if: always()
        run: |
          set +e
          PID=$(cat server_e2e.pid 2>/dev/null)

          echo "Stopping server PID=$PID"

          if [ -n "$PID" ]; then
            ps -p "$PID" -o pid,ppid,pgid,sid,cmd || true

            kill -INT "$PID" 2>/dev/null

            for i in $(seq 1 80); do
              kill -0 "$PID" 2>/dev/null || { echo "server stopped cleanly"; break; }
              sleep 0.2
            done

            if kill -0 "$PID" 2>/dev/null; then
              echo "Escalating kill"
              kill -TERM "$PID" 2>/dev/null
              sleep 0.5
              kill -KILL "$PID" 2>/dev/null
            fi
          fi

          # Ensure nothing remains
          pkill -f "python .*server_async\.py" 2>/dev/null || true
          sleep 0.2

          if pgrep -f "python .*server_async\.py" >/dev/null; then
            echo "Server still running"
            pgrep -af "python .*server_async\.py"
            exit 1
          fi

          echo "Server fully stopped"
          tail -n 200 server_e2e.log || true

      - name: Assert clients_info persisted
        run: |
          set -e
          FILE="Secure-Encrypted-File-Transfer-Protocol/server/data/clients_info.json"

          if [ ! -f "$FILE" ]; then
            echo "clients_info.json not found"
            exit 1
          fi

          python - <<PY
          import json, pathlib
          p = pathlib.Path("$FILE")
          data = json.loads(p.read_text())
          assert isinstance(data, dict)
          print("clients_info entries:", len(data))
          PY
