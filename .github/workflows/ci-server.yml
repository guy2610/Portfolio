name: CI - SEFFP Server (pytest)

on:
  push:
    branches: [ "main" ,"stage3-ci"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11" ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pycryptodome

      - name: Run pytest
        env:
          PYTHONPATH: Secure-Encrypted-File-Transfer-Protocol/server/src
        run: |
          pytest -q Secure-Encrypted-File-Transfer-Protocol/tests/server