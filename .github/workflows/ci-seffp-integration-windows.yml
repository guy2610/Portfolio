name: CI - SEFFP Integration - Windows (E2E)

on:
  push:
    branches: [ "main", "stage3-ci" ]
  pull_request:
  workflow_dispatch:

jobs:
  e2e-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: E2E (Windows) - server + clients in one step
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\Secure-Encrypted-File-Transfer-Protocol\server
        run: |
          $ErrorActionPreference = "Stop"
          
          function Run-Checked([string]$cmd, [string]$why) {
            Write-Host "RUN: $cmd"
            cmd /c $cmd
            $ec = $LASTEXITCODE
            if ($ec -ne 0) {
              throw "Command failed (exit=$ec): $why"
            }
          }

          function Stop-Server($proc) {
            try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 1
          }
          function Wait-Port([string]$host, [int]$port, [int]$seconds) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              try {
                $c = New-Object System.Net.Sockets.TcpClient
                $c.Connect($host, $port)
                $c.Close()
                return
              } catch {
                Start-Sleep -Milliseconds 300
              }
            }
            throw "server did not open port in time"
          }

          # Resolve client exe (already built)
          $root = $env:GITHUB_WORKSPACE

          $candidates = @(
            (Join-Path $root "build\seffp\Release\seffp_client.exe"),
            (Join-Path $root "build\seffp\seffp_client.exe")
          )

          $clientExe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $clientExe) {
            $found = Get-ChildItem -Path (Join-Path $root "build\seffp") -Recurse -Filter "seffp_client.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) { $clientExe = $found.FullName }
          }

          if (-not $clientExe) {
            Write-Host "Listing build\seffp:"
            Get-ChildItem -Path (Join-Path $root "build\seffp") -Recurse -ErrorAction SilentlyContinue | Select-Object FullName | Out-String | Write-Host
            throw "seffp_client.exe not found"
          }

          Write-Host "CLIENT_EXE=$clientExe"

          # ---------- Start normal server ----------
          $ServerDir = Join-Path $env:GITHUB_WORKSPACE "Secure-Encrypted-File-Transfer-Protocol\server"
          Set-Location $ServerDir
          "1234" | Set-Content -NoNewline -Path ".\port.info"

          $OutLog = Join-Path $env:GITHUB_WORKSPACE "server_win.out.log"
          $ErrLog = Join-Path $env:GITHUB_WORKSPACE "server_win.err.log"
          Remove-Item $OutLog,$ErrLog -Force -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -WorkingDirectory $ServerDir `
                -RedirectStandardOutput $OutLog -RedirectStandardError $ErrLog -PassThru

          try {
            Wait-Port "127.0.0.1" 1234 30

            # ---------- E2E workdir ----------
            $root = $env:GITHUB_WORKSPACE
            $work = Join-Path $root "e2e_workdir"
            Remove-Item -Recurse -Force $work -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $work | Out-Null

            "127.0.0.1:1234`nci_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work "transfer.info")
            "hello from ci" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test.txt")
            Copy-Item $clientExe (Join-Path $work "seffp_client.exe")

            Push-Location $work
            Run-Checked ".\seffp_client.exe --info --files=test.txt" "first upload failed"
            Run-Checked ".\seffp_client.exe --info --files=test.txt > second_run.log 2>&1" "relogin run failed"
            $txt = Get-Content second_run.log -Raw
            if ($txt -match "request_825") { throw "Unexpected registration on relogin" }
            if ($txt -notmatch "request_827") { throw "Relogin not detected" }

            "another file" | Out-File -Encoding ascii -NoNewline (Join-Path $work "test2.txt")
            Run-Checked ".\seffp_client.exe --info --files=test.txt,test2.txt" "multi-file upload failed"
            Pop-Location

            # ---------- Parallel ----------
            $base = Join-Path $root "e2e_parallel"
            Remove-Item -Recurse -Force $base -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $base | Out-Null

            $N = 5
            $procs = @()
            for ($i=1; $i -le $N; $i++) {
              $w = Join-Path $base "u$i"
              New-Item -ItemType Directory -Path $w | Out-Null
              "127.0.0.1:1234`nci_user_$i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "transfer.info")
              "hello from client $i" | Out-File -Encoding ascii -NoNewline (Join-Path $w "file_$i.txt")
              Copy-Item $clientExe (Join-Path $w "seffp_client.exe")

              $pp = Start-Process -FilePath (Join-Path $w "seffp_client.exe") `
                    -ArgumentList @("--info","--files=file_$i.txt") `
                    -WorkingDirectory $w -NoNewWindow -PassThru `
                    -RedirectStandardOutput (Join-Path $w "run.out.log") `
                    -RedirectStandardError  (Join-Path $w "run.err.log")
              $procs += $pp
            }

            $failed = $false
            foreach ($pp in $procs) {
              $pp.WaitForExit()
              if ($pp.ExitCode -ne 0) { $failed = $true }
            }
            if ($failed) {
              for ($i=1; $i -le $N; $i++) {
                Write-Host "==== client $i log ===="
                Get-Content (Join-Path $base "u$i\run.out.log") -ErrorAction SilentlyContinue
                Get-Content (Join-Path $base "u$i\run.err.log") -ErrorAction SilentlyContinue
              }
              throw "At least one parallel client failed"
            }

          } finally {
            Stop-Server $p
            Start-Sleep -Seconds 1
            Write-Host "==== server stdout tail ===="
            if (Test-Path $OutLog) { Get-Content $OutLog -Tail 200 }
            Write-Host "==== server stderr tail ===="
            if (Test-Path $ErrLog) { Get-Content $ErrLog -Tail 200 }
          }

          # ---------- Limits server (same step) ----------
          $env:SEFTP_MAX_FILE_SIZE = "64"
          Set-Location $ServerDir

          $OutLog2 = Join-Path $env:GITHUB_WORKSPACE "server_win_limits.out.log"
          $ErrLog2 = Join-Path $env:GITHUB_WORKSPACE "server_win_limits.err.log"
          Remove-Item $OutLog2,$ErrLog2 -Force -ErrorAction SilentlyContinue

          $p2 = Start-Process -FilePath "python" -ArgumentList "-u","server_async.py" -WorkingDirectory $ServerDir `
                -RedirectStandardOutput $OutLog2 -RedirectStandardError $ErrLog2 -PassThru

          try {
            Wait-Port "127.0.0.1" 1234 30

            $work2 = Join-Path $env:GITHUB_WORKSPACE "e2e_workdir_limits"
            Remove-Item -Recurse -Force $work2 -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $work2 | Out-Null

            "127.0.0.1:1234`nci_limits_user" | Out-File -Encoding ascii -NoNewline (Join-Path $work2 "transfer.info")
            Copy-Item $clientExe (Join-Path $work2 "seffp_client.exe")
            python -c "from pathlib import Path; Path(r'$work2\big.bin').write_bytes(b'A'*200)"

            Push-Location $work2
            cmd /c ".\seffp_client.exe --info --files=big.bin > run.log 2>&1"
            Write-Host "limits client exitCode=$LASTEXITCODE"
            Pop-Location

            $clientLog = Get-Content (Join-Path $work2 "run.log") -Raw
            if ($clientLog -notmatch "answer_1607|general error \{bad 828:") {
              throw "Expected client to observe 1607 / bad 828 error"
            }

            $slog = ""
            if (Test-Path $OutLog2) { $slog += (Get-Content $OutLog2 -Raw) }
            if (Test-Path $ErrLog2) { $slog += (Get-Content $ErrLog2 -Raw) }
            if ($slog -notmatch "1607") { throw "Expected 1607 in server log" }
            if ($slog -notmatch "bad_828_limits") { throw "Expected bad_828_limits reset reason" }

          } finally {
            Stop-Server $p
            Start-Sleep -Milliseconds 300
            Write-Host "==== limits server stdout tail ===="
            if (Test-Path $OutLog2) { Get-Content $OutLog2 -Tail 200 }
            Write-Host "==== limits server stderr tail ===="
            if (Test-Path $ErrLog2) { Get-Content $ErrLog2 -Tail 200 }
          }