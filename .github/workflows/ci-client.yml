name: CI - SEFTP Client (CMake + GTest)

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: "Secure-Encrypted-File-Transfer-Protocol/vcpkg.json"
          vcpkgDirectory: "${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg"

      - name: Configure
        run: >
          cmake -S Secure-Encrypted-File-Transfer-Protocol -B build/seftp
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/Secure-Encrypted-File-Transfer-Protocol/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build/seftp --config Release

      - name: Test
        run: ctest --test-dir build/seftp -C Release --output-on-failure